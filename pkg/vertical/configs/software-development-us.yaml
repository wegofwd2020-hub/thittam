# yaml-language-server: $schema=../schema.json
#
# software-development-us — US variant of the software-development vertical.
#
# Built for independent software studios that build and sell their own
# products (SaaS, apps, content) and keep management books in USD. First
# tenant: Kaundinya Labs LLC (Michigan, single-member LLC).
#
# Chart of accounts design
# ------------------------
# Expense accounts are aligned to IRS Schedule C (Form 1040) lines so that
# year-end hand-off to the CPA is a straight roll-up. The line reference is
# in each account's comment, not its name, so the names stay readable in the
# UI. The mapping is a starting point — the CPA has the final word, and an
# entity that elects S-corp status files Form 1120-S instead.
#
# Parents are listed before children: the ledger's SeedChartOfAccounts
# resolves parent_code by looking up accounts already created.
#
# Amounts (budget templates, approval limits) are in USD.
vertical:
  id: software-development-us
  name: Software Studio (US)
  version: 1.0.0
  description: >
    For US independent software studios and product companies that build and sell
    their own software. USD amounts, Schedule C-aligned chart of accounts, 1099-NEC
    contractor tracking, and state sales/use tax treatment on expenses.

  entity_labels:
    project: Product
    project_plural: Products
    phase: Stage
    phase_plural: Stages
    team_member: Contributor
    team_member_plural: Contributors
    rate_label: Hourly Rate
    rate_unit: hour

  phase_types:
    - id: discovery
      label: Discovery & Validation
      order: 1
      is_billable: false
      allowed_transitions: [design, on_hold, sunset]
    - id: design
      label: Product Design & Architecture
      order: 2
      is_billable: false
      allowed_transitions: [build, on_hold, sunset]
    - id: build
      label: Build
      order: 3
      is_billable: false
      allowed_transitions: [beta, on_hold, sunset]
    - id: beta
      label: Private Beta
      order: 4
      is_billable: false
      allowed_transitions: [launched, on_hold, sunset]   # graph must be acyclic
    - id: launched
      label: Launched / Generally Available
      order: 5
      is_billable: true
      allowed_transitions: [maintenance, sunset]
    - id: maintenance
      label: Maintenance
      order: 6
      is_billable: true
      allowed_transitions: [sunset]
    - id: on_hold
      label: On Hold
      order: 7
      is_billable: false
      allowed_transitions: [sunset]
    - id: sunset
      label: Sunset / Retired
      order: 8
      is_billable: false
      allowed_transitions: []

  budget_categories:
    - id: contract_labor
      label: Contract Labor
      description: Freelancers and contractors paid on 1099-NEC
      default_account_code: "6100"
    - id: cloud_hosting
      label: Cloud & Hosting
      description: AWS, GCP, Azure, Hetzner, domains, CDN
      default_account_code: "6210"
    - id: software_saas
      label: Software & SaaS
      description: Dev tools, AI/LLM APIs, subscriptions
      default_account_code: "6220"
    - id: marketing
      label: Advertising & Marketing
      description: Ads, landing pages, app-store listing assets
      default_account_code: "6300"
    - id: professional_fees
      label: Legal & Professional Fees
      description: CPA, attorney, registered agent
      default_account_code: "6400"
    - id: travel
      label: Travel
      description: Conferences, client and partner visits
      default_account_code: "6500"
    - id: equipment
      label: Equipment
      description: Computers and devices (capitalised and depreciated)
      default_account_code: "1500"

  budget_templates:
    - name: Product Build — Solo Studio (annual)
      description: Typical yearly run-rate for one product built by the owner plus occasional contractors
      line_items:
        - category_id: cloud_hosting
          description: Cloud infrastructure (dev + prod)
          account_code: "6210"
          default_amount: 3000
          is_required: true
        - category_id: software_saas
          description: Dev tools and AI/LLM API usage
          account_code: "6220"
          default_amount: 2400
          is_required: true
        - category_id: contract_labor
          description: Design / specialist contractors
          account_code: "6100"
          default_amount: 5000
          is_required: false
        - category_id: marketing
          description: Launch marketing
          account_code: "6300"
          default_amount: 1500
          is_required: false
    - name: Company Overhead (annual)
      description: Costs shared across all products — compliance, advisors, office
      line_items:
        - category_id: professional_fees
          description: CPA — annual return and bookkeeping review
          account_code: "6400"
          default_amount: 1500
          is_required: true
        - category_id: professional_fees
          description: Attorney — operating agreement review
          account_code: "6400"
          default_amount: 1000
          is_required: false
        - category_id: software_saas
          description: Company email and productivity suite
          account_code: "6220"
          default_amount: 300
          is_required: true

  expense_categories:
    - id: contractor_invoice
      label: Contractor Invoice (1099)
      tax_treatment: us_1099_nec
      default_account_code: "6100"
      requires_po: false
    - id: cloud_invoice
      label: Cloud / Hosting Invoice
      tax_treatment: none
      default_account_code: "6210"
      requires_po: false
    - id: saas_subscription
      label: Software / SaaS Subscription
      tax_treatment: none
      default_account_code: "6220"
      requires_po: false
    - id: out_of_state_purchase
      label: Purchase Without Sales Tax (use tax due)
      tax_treatment: us_use_tax
      default_account_code: "6710"
      requires_po: false
    - id: office_supplies
      label: Office Supplies (sales tax paid)
      tax_treatment: us_sales_tax_paid
      default_account_code: "6710"
      requires_po: false
    - id: advertising
      label: Advertising & Marketing
      tax_treatment: none
      default_account_code: "6300"
      requires_po: false
    - id: professional_fees
      label: Legal & Professional Fees
      tax_treatment: none
      default_account_code: "6400"
      requires_po: false
    - id: travel
      label: Travel
      tax_treatment: none
      default_account_code: "6500"
      requires_po: false
    - id: business_meals
      label: Business Meals (50%)
      tax_treatment: us_meals_50pct
      default_account_code: "6510"
      requires_po: false
    - id: taxes_licenses
      label: State Fees, Taxes & Licenses
      tax_treatment: none
      default_account_code: "6600"
      requires_po: false
    - id: bank_fees
      label: Bank & Payment Processing Fees
      tax_treatment: none
      default_account_code: "6820"
      requires_po: false
    - id: miscellaneous
      label: Miscellaneous
      tax_treatment: none
      default_account_code: "6900"
      requires_po: false

  # Single-owner studio: the owner holds super_admin. These limits only bite
  # once contributors are invited with lower roles.
  approval_workflow:
    limits:
      - role: coordinator
        max_amount: 500
      - role: project_supervisor
        max_amount: 2500
      - role: manager
        max_amount: 10000
    dual_approval_above: 10000

  inventory_categories:
    - id: computer_equipment
      label: Computers & Devices
      is_trackable: true
      depreciation_years: 5
    - id: office_furniture
      label: Office Furniture
      is_trackable: true
      depreciation_years: 7
    - id: software_license
      label: Perpetual Software License
      is_trackable: false
      depreciation_years: 3

  default_chart_of_accounts:
    # ── Assets ──────────────────────────────────────────────────────────
    - code: "1000"
      name: Cash & Bank
      account_type: asset
      parent_code: null
    - code: "1010"
      name: Business Checking
      account_type: asset
      parent_code: "1000"
    - code: "1020"
      name: Business Savings
      account_type: asset
      parent_code: "1000"
    - code: "1100"
      name: Accounts Receivable
      account_type: asset
      parent_code: null
    - code: "1200"
      name: Prepaid Expenses
      account_type: asset
      parent_code: null
    - code: "1500"
      name: Equipment
      account_type: asset
      parent_code: null
    - code: "1590"
      name: Accumulated Depreciation
      account_type: asset          # contra-asset (credit balance)
      parent_code: "1500"
    # ── Liabilities ─────────────────────────────────────────────────────
    - code: "2000"
      name: Accounts Payable
      account_type: liability
      parent_code: null
    - code: "2100"
      name: Business Credit Card
      account_type: liability
      parent_code: null
    - code: "2200"
      name: Sales & Use Tax Payable
      account_type: liability
      parent_code: null
    - code: "2300"
      name: Due to Owner (reimbursable)
      account_type: liability
      parent_code: null
    # ── Equity ──────────────────────────────────────────────────────────
    - code: "3000"
      name: Owner's Capital
      account_type: equity
      parent_code: null
    - code: "3100"
      name: Owner's Contributions
      account_type: equity
      parent_code: "3000"
    - code: "3200"
      name: Owner's Draws
      account_type: equity         # contra-equity (debit balance)
      parent_code: "3000"
    - code: "3900"
      name: Retained Earnings
      account_type: equity
      parent_code: null
    # ── Revenue ─────────────────────────────────────────────────────────
    - code: "4000"
      name: Revenue
      account_type: revenue        # Sch C line 1
      parent_code: null
    - code: "4100"
      name: Product & Subscription Revenue
      account_type: revenue
      parent_code: "4000"
    - code: "4200"
      name: Services & Consulting Revenue
      account_type: revenue
      parent_code: "4000"
    - code: "4900"
      name: Other Income
      account_type: revenue        # Sch C line 6
      parent_code: null
    # ── Expenses (Schedule C line in comment) ───────────────────────────
    - code: "6000"
      name: Operating Expenses
      account_type: expense
      parent_code: null
    - code: "6100"
      name: Contract Labor
      account_type: expense        # line 11
      parent_code: "6000"
    - code: "6200"
      name: Technology
      account_type: expense
      parent_code: "6000"
    - code: "6210"
      name: Cloud & Hosting
      account_type: expense        # line 27a (other) — confirm with CPA
      parent_code: "6200"
    - code: "6220"
      name: Software & SaaS Subscriptions
      account_type: expense        # line 18 or 27a — confirm with CPA
      parent_code: "6200"
    - code: "6300"
      name: Advertising & Marketing
      account_type: expense        # line 8
      parent_code: "6000"
    - code: "6400"
      name: Legal & Professional Fees
      account_type: expense        # line 17
      parent_code: "6000"
    - code: "6500"
      name: Travel
      account_type: expense        # line 24a
      parent_code: "6000"
    - code: "6510"
      name: Business Meals (50% deductible)
      account_type: expense        # line 24b
      parent_code: "6500"
    - code: "6600"
      name: Taxes & Licenses
      account_type: expense        # line 23 (MI annual statement fee, etc.)
      parent_code: "6000"
    - code: "6700"
      name: Office
      account_type: expense
      parent_code: "6000"
    - code: "6710"
      name: Office Supplies & Expense
      account_type: expense        # line 18 / 22
      parent_code: "6700"
    - code: "6720"
      name: Business Use of Home
      account_type: expense        # line 30 (Form 8829 or simplified method)
      parent_code: "6700"
    - code: "6800"
      name: Insurance
      account_type: expense        # line 15
      parent_code: "6000"
    - code: "6820"
      name: Bank & Payment Processing Fees
      account_type: expense        # line 27a
      parent_code: "6000"
    - code: "6850"
      name: Depreciation
      account_type: expense        # line 13 (Form 4562)
      parent_code: "6000"
    - code: "6900"
      name: Other Expenses
      account_type: expense        # line 27a
      parent_code: "6000"

  report_definitions:
    - id: product_pnl
      name: Product P&L
      description: Revenue vs cost per product, with company overhead shown separately
      data_sources: [budget-planning, expense-tracking, general-ledger]
      default_columns: [product, revenue, cost, margin_pct, stage]
    - id: schedule_c_rollup
      name: Schedule C Roll-up
      description: Year-to-date totals by expense account for the CPA hand-off
      data_sources: [general-ledger]
      default_columns: [account_code, account_name, ytd_amount]
    - id: contractor_1099
      name: 1099-NEC Contractor Summary
      description: Calendar-year payments per contractor on us_1099_nec expenses
      data_sources: [expense-tracking]
      default_columns: [vendor, ytd_paid, w9_on_file]
    - id: budget_burndown
      name: Budget Burndown
      description: Remaining budget over time per product
      data_sources: [budget-planning, expense-tracking]
      default_columns: [date, budget_remaining, actual_spend, forecast]

  role_labels:
    super_admin: Owner
    manager: Studio Manager
    coordinator: Lead Contributor
    accountant: Bookkeeper / CPA
    inventory_manager: Asset Manager
    project_supervisor: Product Lead
    member: Contributor

  custom_fields:
    project:
      - key: revenue_model
        label: Revenue Model
        type: select
        options: [subscription, one_time, usage_based, free, internal]
        required: false
      - key: repository
        label: Repository
        type: text
        required: false
    expense:
      - key: vendor_w9_on_file
        label: Vendor W-9 on File
        type: select
        options: ["yes", "no", "not_applicable"]
        required: false
      - key: receipt_reference
        label: Receipt Reference
        type: text
        required: false
