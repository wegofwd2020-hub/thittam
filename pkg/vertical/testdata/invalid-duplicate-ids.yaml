vertical:
  id: duplicate-test
  name: Duplicate Test
  version: 1.0.0
  description: Test vertical with duplicate IDs.

  entity_labels:
    project: Project
    project_plural: Projects
    phase: Phase
    phase_plural: Phases
    team_member: Member
    team_member_plural: Members
    rate_label: Rate
    rate_unit: day

  phase_types:
    - id: design
      label: Design
      order: 1
      is_billable: false
      allowed_transitions: [done]
    - id: design
      label: Design Again
      order: 2
      is_billable: false
      allowed_transitions: [done]
    - id: done
      label: Done
      order: 3
      is_billable: false
      allowed_transitions: []

  budget_categories:
