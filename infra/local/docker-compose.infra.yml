# Thittam — middleware only (no postgres)
#
# Use this when pointing DATABASE_URL at the system PostgreSQL (port 5433).
# This avoids conflicts with other projects that also run Docker postgres.
#
# Run:  docker compose -f infra/local/docker-compose.infra.yml up -d
# Stop: docker compose -f infra/local/docker-compose.infra.yml down
#
# Prometheus notes:
#   - Go services run on the HOST machine (not in Docker), so prometheus uses
#     host.docker.internal to reach their /metrics ports (9090-9098).
#   - extra_hosts adds host-gateway so Linux resolves host.docker.internal.
#   - Open http://localhost:9300 for the Prometheus UI.
#   - Open http://localhost:3130 for Grafana (admin/admin in dev).
#   - Open http://localhost:9391 for Pushgateway (batch-job metrics).

# Resolve host.docker.internal on Linux (macOS/Windows handle this natively).
x-host-gateway: &host-gateway
  extra_hosts:
    - "host.docker.internal:host-gateway"

services:

  prometheus:
    image: prom/prometheus:v2.51.2
    <<: *host-gateway
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=7d"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
    ports:
      - "9300:9090"   # 9090 is taken by project-management metrics on the host
    volumes:
      - ../prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../prometheus/alerts:/etc/prometheus/alerts:ro
      - prometheus_data:/prometheus
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/-/healthy | grep -q Healthy"]
      interval: 10s
      retries: 5
    restart: unless-stopped

  # Pushgateway accepts pushes from short-lived batch jobs (#92 Stage 5)
  # — the retention-sweeper CronJob pushes its metrics here at end of
  # run and Prometheus scrapes Pushgateway on the normal interval.
  # Default retention: metrics persist until overwritten by a newer
  # push with the same {job, instance} grouping.
  # Grafana renders the retention-sweeper dashboard (#92 Stage 5b) and
  # any future dashboards (SLO, Redis, NATS). Datasource + dashboard
  # provisioning is file-based so the config lives in-tree and the
  # running container is stateless (restarting clears nothing operator
  # would miss — all definitions are re-provisioned from the mounts).
  grafana:
    image: grafana/grafana:10.4.2
    ports:
      # Host port 3130 — Thittam's Next.js web app takes 3100, and
      # StudyBuddy takes 3000. 3130 sits in Thittam's 3100-series
      # (same mental model for operators) and the +30 offset is a
      # soft hint back at Grafana's default :3000 for anyone
      # debugging. Internal container port stays 3000.
      - "3130:3000"
    environment:
      # Local dev only — suppress the first-login password prompt by
      # pinning admin/admin. Obviously never replicate to prod, where
      # Grafana should be behind the same SSO as the rest of the ops
      # console.
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      # Disable signup and anonymous access — only the admin login works.
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      # Shorten log noise.
      GF_LOG_LEVEL: warn
    volumes:
      # File-based provisioning: Grafana reads these directories at
      # startup and on config reload.
      - ../grafana/provisioning:/etc/grafana/provisioning:ro
      - ../grafana/dashboards:/etc/grafana/dashboards:ro
      # Persist Grafana's own state (user prefs, API keys, alert-rule
      # history). Dashboards are provisioned from disk so this volume
      # does NOT hold dashboard JSON — editing a dashboard in the UI
      # won't persist across a restart; edit the JSON file instead.
      - grafana_data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health | grep -q ok"]
      interval: 10s
      retries: 10
    restart: unless-stopped

  pushgateway:
    image: prom/pushgateway:v1.9.0
    ports:
      # Host port 9391 avoids collision with budget-planning's /metrics
      # on :9091 (see prometheus.yml scrape configs). Inside Docker,
      # Pushgateway still listens on 9091 — Prometheus scrapes it via
      # `pushgateway:9091` on the compose network.
      - "9391:9091"
    # Pushgateway is intentionally ephemeral: we don't mount a volume,
    # so a restart clears all pushed metrics. That's fine — the
    # sweeper re-pushes on every run, and Prometheus has the historical
    # time series already.
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9091/-/healthy | grep -q OK"]
      interval: 10s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"   # 6380 avoids conflict with StudyBuddy's 6379
    command: redis-server --save ""   # no persistence in dev
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 5

  nats:
    image: nats:2.10-alpine
    command: ["-js", "-m", "8222"]   # JetStream + monitoring
    ports:
      - "4222:4222"   # client connections
      - "8222:8222"   # HTTP monitoring UI
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8222/healthz | grep -q ok"]
      interval: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: thittam
      MINIO_ROOT_PASSWORD: thittam_dev
    ports:
      - "9000:9000"   # S3-compatible API
      - "9001:9001"   # MinIO web console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live"]
      interval: 10s
      retries: 5

  # Creates the thittam-documents bucket then exits
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 thittam thittam_dev &&
        mc mb --ignore-existing local/thittam-documents &&
        echo 'Bucket thittam-documents ready.'
      "
    restart: "no"

  kong:
    image: kong:3.6
    restart: unless-stopped
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/kong.yml
      KONG_PROXY_LISTEN: "0.0.0.0:8500"
      KONG_ADMIN_LISTEN: "off"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./kong.yml:/kong/kong.yml:ro
    ports:
      - "8500:8500"   # single REST origin → per-service grpc-gateways (#60 Phase B)
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  minio_data:
  prometheus_data:
  grafana_data:
