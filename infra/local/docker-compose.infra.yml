# Thittam — middleware only (no postgres)
#
# Use this when pointing DATABASE_URL at the system PostgreSQL (port 5433).
# This avoids conflicts with other projects that also run Docker postgres.
#
# Run:  docker compose -f infra/local/docker-compose.infra.yml up -d
# Stop: docker compose -f infra/local/docker-compose.infra.yml down
#
# Prometheus notes:
#   - Go services run on the HOST machine (not in Docker), so prometheus uses
#     host.docker.internal to reach their /metrics ports (9090-9098).
#   - extra_hosts adds host-gateway so Linux resolves host.docker.internal.
#   - Open http://localhost:9300 for the Prometheus UI.

# Resolve host.docker.internal on Linux (macOS/Windows handle this natively).
x-host-gateway: &host-gateway
  extra_hosts:
    - "host.docker.internal:host-gateway"

services:

  prometheus:
    image: prom/prometheus:v2.51.2
    <<: *host-gateway
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=7d"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
    ports:
      - "9300:9090"   # 9090 is taken by project-management metrics on the host
    volumes:
      - ../prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../prometheus/alerts:/etc/prometheus/alerts:ro
      - prometheus_data:/prometheus
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/-/healthy | grep -q Healthy"]
      interval: 10s
      retries: 5
    restart: unless-stopped

  # Pushgateway accepts pushes from short-lived batch jobs (#92 Stage 5)
  # — the retention-sweeper CronJob pushes its metrics here at end of
  # run and Prometheus scrapes Pushgateway on the normal interval.
  # Default retention: metrics persist until overwritten by a newer
  # push with the same {job, instance} grouping.
  pushgateway:
    image: prom/pushgateway:v1.9.0
    ports:
      # Host port 9391 avoids collision with budget-planning's /metrics
      # on :9091 (see prometheus.yml scrape configs). Inside Docker,
      # Pushgateway still listens on 9091 — Prometheus scrapes it via
      # `pushgateway:9091` on the compose network.
      - "9391:9091"
    # Pushgateway is intentionally ephemeral: we don't mount a volume,
    # so a restart clears all pushed metrics. That's fine — the
    # sweeper re-pushes on every run, and Prometheus has the historical
    # time series already.
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9091/-/healthy | grep -q OK"]
      interval: 10s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"   # 6380 avoids conflict with StudyBuddy's 6379
    command: redis-server --save ""   # no persistence in dev
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 5

  nats:
    image: nats:2.10-alpine
    command: ["-js", "-m", "8222"]   # JetStream + monitoring
    ports:
      - "4222:4222"   # client connections
      - "8222:8222"   # HTTP monitoring UI
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8222/healthz | grep -q ok"]
      interval: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: thittam
      MINIO_ROOT_PASSWORD: thittam_dev
    ports:
      - "9000:9000"   # S3-compatible API
      - "9001:9001"   # MinIO web console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live"]
      interval: 10s
      retries: 5

  # Creates the thittam-documents bucket then exits
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 thittam thittam_dev &&
        mc mb --ignore-existing local/thittam-documents &&
        echo 'Bucket thittam-documents ready.'
      "
    restart: "no"

volumes:
  minio_data:
  prometheus_data:
