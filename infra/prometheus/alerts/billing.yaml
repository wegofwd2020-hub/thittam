groups:
  # ── Billing service business alerts ───────────────────────────────────────
  #
  # The billing service manages subscriptions, invoices, and plan enforcement.
  # Failures here have direct revenue impact: tenants may be incorrectly
  # billing, dunning cycles may silently break, or plan limits may not be
  # enforced — allowing overuse without charge.
  #
  # Metrics exposed by the billing service (job=billing) via
  # grpc-ecosystem/go-grpc-prometheus + custom Prometheus counters/gauges
  # registered in cmd/billing/main.go:
  #
  #   grpc_server_handled_total{job="billing", grpc_code, grpc_method}
  #   billing_dunning_attempts_total{outcome}   — "succeeded" | "failed" | "retrying"
  #   billing_subscriptions_total{status}       — "active" | "suspended" | "cancelled"
  #   billing_plan_limit_rejections_total{plan, resource}
  #
  # Billing metrics are served on port 9099 (see cmd/billing/main.go,
  # server.Config{MetricsPort: 9099}) and scraped as job="billing".
  #
  # KNOWN DORMANT RULES: four rules below reference metrics nothing in this
  # tree emits, and cannot fire: BillingDunningFailureSpike
  # (billing_dunning_attempts_total), BillingSuspendedSubscriptionsHigh
  # (billing_subscriptions_total), BillingPlanLimitRejectionsHigh
  # (billing_plan_limit_rejections_total), and BillingServiceErrorRateElevated
  # (grpc_server_handled_total, which comes from go-grpc-prometheus — this
  # repo's gRPC metrics are exported under different names by
  # pkg/observability/metrics.go). Left in place as the documented intent for
  # when those metrics are wired up; do not treat their silence as health.
  #
  # Outbox relay metrics (#134), defined in services/billing/outbox_relay.go:
  #
  #   thittam_billing_outbox_published_total
  #   thittam_billing_outbox_failed_total
  #   thittam_billing_outbox_dead_lettered_total
  #   thittam_billing_outbox_pending              (gauge)
  #   thittam_billing_outbox_oldest_pending_seconds (gauge)
  #   thittam_billing_outbox_dead                 (gauge)
  #   thittam_billing_outbox_stats_last_success_timestamp_seconds (gauge)

  - name: thittam_billing
    interval: 60s
    rules:

      # ── Dunning failure spike ────────────────────────────────────────────
      # A dunning failure means an automated payment retry attempt failed.
      # One or two per day is normal (insufficient funds, expired cards).
      # A spike suggests a payment gateway outage or a systematic card issue
      # across a batch of tenants.
      - alert: BillingDunningFailureSpike
        expr: |
          rate(billing_dunning_attempts_total{outcome="failed"}[15m]) * 60 > 5
        for: 10m
        labels:
          severity: warning
          team: platform
          component: billing
        annotations:
          summary: "Billing dunning failures: {{ $value | printf \"%.1f\" }}/min (> 5/min) — check payment gateway"
          description: >
            The billing service is experiencing more than 5 dunning failures
            per minute over the last 15 minutes.
            This may indicate a payment gateway outage (Razorpay/Stripe),
            a batch of expired cards from a recent card-update cycle,
            or a misconfiguration in the retry schedule.
            Check the billing service logs and payment gateway status page.
          runbook_url: "https://github.com/wegofwd2020-hub/thittam_docs/blob/main/docs/developers/operations/runbook.md#billing-dunning-failures"

      # ── Suspended subscriptions increase ────────────────────────────────
      # A sudden increase in suspended subscriptions (failed payment, plan
      # expiry) across multiple tenants is unusual and worth investigating
      # before tenants start raising support tickets.
      - alert: BillingSuspendedSubscriptionsHigh
        expr: |
          billing_subscriptions_total{status="suspended"} > 10
        for: 5m
        labels:
          severity: warning
          team: platform
          component: billing
        annotations:
          summary: "{{ $value }} subscriptions suspended — investigate dunning health"
          description: >
            There are {{ $value }} subscriptions in suspended state.
            Suspended tenants cannot access the platform. If the count has
            grown recently it may indicate a bulk payment failure.
            Verify against the dunning failure rate alert. If both are firing
            simultaneously, the payment gateway is likely degraded.
          runbook_url: "https://github.com/wegofwd2020-hub/thittam_docs/blob/main/docs/developers/operations/runbook.md#billing-suspensions"

      # ── Plan limit rejection rate ────────────────────────────────────────
      # Sustained plan limit rejections mean tenants are hitting their
      # resource ceilings. This is expected near month-end but a persistent
      # spike may indicate a misconfigured plan or a tenant who should be
      # upsold to a higher tier.
      - alert: BillingPlanLimitRejectionsHigh
        expr: |
          rate(billing_plan_limit_rejections_total[5m]) * 60 > 10
        for: 5m
        labels:
          severity: warning
          team: platform
          component: billing
        annotations:
          summary: "Plan limit rejections: {{ $value | printf \"%.0f\" }}/min (> 10/min) for plan={{ $labels.plan }}, resource={{ $labels.resource }}"
          description: >
            The billing service is rejecting more than 10 requests per minute
            for plan={{ $labels.plan }}, resource={{ $labels.resource }}.
            If this is a single tenant, consider reaching out to offer an upgrade.
            If it affects multiple tenants on the same plan, the plan limits
            may be misconfigured (see pkg/billing/plans.go).
          runbook_url: "https://github.com/wegofwd2020-hub/thittam_docs/blob/main/docs/developers/operations/runbook.md#billing-plan-limits"

      # ── Billing service gRPC errors ──────────────────────────────────────
      # Tighter threshold than the global SLO because billing errors have
      # direct revenue impact. 2% error rate on billing warrants immediate
      # investigation even if other services are healthy.
      - alert: BillingServiceErrorRateElevated
        expr: |
          (
            sum(rate(grpc_server_handled_total{job="billing", grpc_code!="OK"}[5m]))
            /
            sum(rate(grpc_server_handled_total{job="billing"}[5m]))
          ) > 0.02
        for: 5m
        labels:
          severity: warning
          team: platform
          component: billing
        annotations:
          summary: "Billing service gRPC error rate {{ $value | humanizePercentage }} (> 2%)"
          description: >
            The billing service has a gRPC non-OK response rate of
            {{ $value | humanizePercentage }} over the last 5 minutes.
            Billing errors may affect subscription management, invoice generation,
            or plan enforcement. Investigate immediately — revenue and tenant
            access may be at risk.
          runbook_url: "https://github.com/wegofwd2020-hub/thittam_docs/blob/main/docs/developers/operations/runbook.md#billing-errors"

      # ── Outbox dead-letter queue non-empty ───────────────────────────────
      # A dead-lettered event is one the relay could not publish after
      # maxOutboxAttempts tries while OTHER events in its batch published
      # fine — so the event itself is bad, not the broker. Nothing drains
      # this queue automatically.
      #
      # This is a correctness alert, not hygiene. The only event on the
      # outbox today is subscription.suspended; until it is delivered, iam's
      # consumer never starts that tenant's retention clock, and the tenant
      # keeps its data past the retention window. Silently.
      - alert: BillingOutboxDeadLetter
        expr: |
          thittam_billing_outbox_dead > 0
        for: 5m
        labels:
          severity: critical
          team: platform
          component: billing
        annotations:
          summary: "{{ $value }} billing outbox event(s) dead-lettered — delivery has stopped for them"
          description: >
            {{ $value }} event(s) are parked in event_outbox_dead. Each one is
            a domain event that will never be delivered until a human replays
            it. For subscription.suspended events this means the affected
            tenant's retention clock never starts.
            Inspect with `outbox-admin list` (run with the runtime DSN), fix
            the underlying cause, then `outbox-admin replay --id <uuid>`.
          runbook_url: "https://github.com/wegofwd2020-hub/thittam_docs/blob/main/docs/developers/operations/runbook.md#billing-outbox-dead-letter"

      # ── Outbox backlog going stale ───────────────────────────────────────
      # The relay ticks every 15s and claims 100 rows, so a healthy oldest-
      # pending age stays well under a minute. 15 minutes means the relay is
      # not running, NATS is down, or publishes are failing wholesale (the
      # systemic guard deliberately does NOT dead-letter in that case, so the
      # backlog simply grows — this alert is what surfaces it).
      #
      # This alert depends on fresh stats: thittam_billing_outbox_oldest_pending_seconds
      # is only as current as the relay's last successful OutboxStats read. If
      # that read is failing (e.g. Postgres is down), the gauge FREEZES at its
      # last value and this alert cannot fire no matter how stale the backlog
      # actually is. It is paired with BillingOutboxStatsStale below, which
      # detects exactly that condition — when both could apply, trust
      # BillingOutboxStatsStale and treat this alert's silence as uninformative.
      - alert: BillingOutboxBacklogStale
        expr: |
          thittam_billing_outbox_oldest_pending_seconds > 900
        for: 10m
        labels:
          severity: warning
          team: platform
          component: billing
        annotations:
          summary: "Oldest unpublished billing outbox event is {{ $value | humanizeDuration }} old (> 15m)"
          description: >
            The billing outbox relay has not drained its backlog. Either the
            relay goroutine is not running (check that cmd/billing started with
            NATS configured — the relay is gated on a non-nil publisher), or
            NATS is unreachable.
            Check thittam_billing_outbox_pending for depth and the billing
            service logs for "outbox batch failed".
          runbook_url: "https://github.com/wegofwd2020-hub/thittam_docs/blob/main/docs/developers/operations/runbook.md#billing-outbox-backlog"

      # ── Outbox publish failures ──────────────────────────────────────────
      # Any sustained publish failure, not a single blip. The window (5m) is
      # deliberately SHORTER than the dwell (10m): a lone failure ages out of
      # the trailing 5m increase() window long before the 10m `for` elapses,
      # so only a failure that keeps recurring tick after tick — i.e. genuine
      # sustained failure — can hold the condition true for the full dwell.
      # (Making the window equal to or longer than the dwell would let one
      # transient failure at t=0 keep increase(...) > 0 true for the entire
      # dwell period, turning "paged or not" into a coin-flip on evaluation
      # alignment — exactly what this alert must not do.)
      #
      # This also defangs a false-page source: on an ordinary cmd/billing
      # deploy or OOM restart, the counter resets to 0 and Prometheus's
      # counter-reset compensation can read the pre-restart count as a fresh
      # increase for up to one window length. With a 5m window that can only
      # sustain the condition for 5m, well short of the 10m dwell — so a
      # routine restart cannot page.
      - alert: BillingOutboxPublishFailing
        expr: |
          increase(thittam_billing_outbox_failed_total[5m]) > 0
        for: 10m
        labels:
          severity: warning
          team: platform
          component: billing
        annotations:
          summary: "Billing outbox publishes failing ({{ $value | printf \"%.0f\" }} in 5m)"
          description: >
            The outbox relay is failing to publish events to NATS. Events are
            retried on each 15s tick and are not lost. If the whole batch is
            failing, nothing is dead-lettered by design — the backlog grows
            until NATS recovers.
            Check NATS JetStream health and the FINANCIAL stream.
          runbook_url: "https://github.com/wegofwd2020-hub/thittam_docs/blob/main/docs/developers/operations/runbook.md#billing-outbox-publish-failures"

      # ── Outbox stats read stale (relay is blind) ─────────────────────────
      # thittam_billing_outbox_oldest_pending_seconds and
      # thittam_billing_outbox_dead are only updated after a successful
      # OutboxStats read. ClaimUnsentOutbox and OutboxStats hit the same
      # Postgres, so a DB outage breaks both simultaneously — the gauges
      # freeze at their last value (0 at process start) while the process
      # stays up (up{job="billing"} == 1), so no other billing alert fires.
      # The relay ticks every 15s; 300s is ~20 missed ticks — unambiguous,
      # not flappy.
      - alert: BillingOutboxStatsStale
        expr: |
          (time() - thittam_billing_outbox_stats_last_success_timestamp_seconds) > 300
        for: 5m
        labels:
          severity: critical
          team: platform
          component: billing
        annotations:
          summary: "Billing outbox stats have not updated in {{ $value | humanizeDuration }} — the relay is blind"
          description: >
            The outbox relay has not completed a successful OutboxStats read
            in over 5 minutes. This almost always means the database backing
            the billing outbox is unreachable or the relay goroutine has
            stopped. Because the read is failing, thittam_billing_outbox_oldest_pending_seconds
            and thittam_billing_outbox_dead are FROZEN at their last known
            values — BillingOutboxBacklogStale and BillingOutboxDeadLetter
            CANNOT FIRE right now no matter how bad things actually are.
            Their silence means nothing while this alert is active — do not
            read it as "backlog is fine." Check Postgres health first;
            ClaimUnsentOutbox uses the same connection and is very likely
            failing too, so the real backlog may already be growing unseen.
          runbook_url: "https://github.com/wegofwd2020-hub/thittam_docs/blob/main/docs/developers/operations/runbook.md#billing-outbox-stats-stale"
