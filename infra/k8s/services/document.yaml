# document — Deployment, Service, HPA
#
# File storage, versioning, access control, and e-signature workflows.
# Files are stored in MinIO (S3-compatible). This service issues presigned
# URLs — clients upload and download directly to object storage, never
# through this service. Binary content does not pass through the process.
#
# gRPC port:    8088
# Metrics port: 9098
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: document
  namespace: thittam
  labels:
    app: document
    app.kubernetes.io/name: document
    app.kubernetes.io/part-of: thittam
    app.kubernetes.io/component: service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: document
  template:
    metadata:
      labels:
        app: document
        app.kubernetes.io/name: document
        app.kubernetes.io/part-of: thittam
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9098"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: document
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        fsGroup: 65534
      volumes:
        # JWT public key — not a secret (it can only verify signatures, not
        # create them), so it is mounted from a ConfigMap. See
        # infra/k8s/config/jwt-public-configmap.yaml.
        - name: jwt-public-key
          configMap:
            name: thittam-jwt-public
      containers:
        - name: document
          image: ghcr.io/wegofwd2020-hub/thittam/document:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: grpc
              containerPort: 8088
              protocol: TCP
            - name: metrics
              containerPort: 9098
              protocol: TCP
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: thittam-db
                  key: runtime_url
            # MinIO credentials (T2 — object storage access key)
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: thittam-minio
                  key: access_key
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: thittam-minio
                  key: secret_key
            - name: JWT_PUBLIC_KEY_PATH
              value: /etc/thittam/jwt/jwt_public.pem
          envFrom:
            - configMapRef:
                name: thittam-common
          volumeMounts:
            - name: jwt-public-key
              mountPath: /etc/thittam/jwt
              readOnly: true
          resources:
            # Document service coordinates presigned URL generation and
            # e-signature state — moderate CPU, higher memory than bare services
            # because it tracks open signature sessions.
            requests:
              cpu: 150m
              memory: 256Mi
            limits:
              cpu: 400m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /readyz
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            initialDelaySeconds: 15
            periodSeconds: 30
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: document
  namespace: thittam
  labels:
    app: document
    app.kubernetes.io/name: document
    app.kubernetes.io/part-of: thittam
spec:
  selector:
    app: document
  type: ClusterIP
  ports:
    - name: grpc
      port: 8088
      targetPort: grpc
      protocol: TCP
    - name: metrics
      port: 9098
      targetPort: metrics
      protocol: TCP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: document
  namespace: thittam
  labels:
    app: document
    app.kubernetes.io/part-of: thittam
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: document
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
