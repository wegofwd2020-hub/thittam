# notifications — Deployment, Service, HPA
#
# Email, SMS, push, and in-app notification delivery.
# Consumes NATS FINANCIAL, PRODUCTION, and SYSTEM streams.
# Fan-out delivery: one event may generate N notifications across channels.
#
# gRPC port:    8087
# Metrics port: 9097
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notifications
  namespace: thittam
  labels:
    app: notifications
    app.kubernetes.io/name: notifications
    app.kubernetes.io/part-of: thittam
    app.kubernetes.io/component: service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: notifications
  template:
    metadata:
      labels:
        app: notifications
        app.kubernetes.io/name: notifications
        app.kubernetes.io/part-of: thittam
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9097"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: notifications
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        fsGroup: 65534
      volumes:
        # JWT public key — not a secret (it can only verify signatures, not
        # create them), so it is mounted from a ConfigMap. See
        # infra/k8s/config/jwt-public-configmap.yaml.
        - name: jwt-public-key
          configMap:
            name: thittam-jwt-public
      containers:
        - name: notifications
          image: ghcr.io/wegofwd2020-hub/thittam/notifications:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: grpc
              containerPort: 8087
              protocol: TCP
            - name: metrics
              containerPort: 9097
              protocol: TCP
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: thittam-db
                  key: runtime_url
            # SendGrid API key (T2 — email delivery)
            - name: SENDGRID_API_KEY
              valueFrom:
                secretKeyRef:
                  name: thittam-notifications
                  key: sendgrid_api_key
            # Firebase Cloud Messaging server key (T2 — push)
            - name: FCM_SERVER_KEY
              valueFrom:
                secretKeyRef:
                  name: thittam-notifications
                  key: fcm_server_key
            - name: JWT_PUBLIC_KEY_PATH
              value: /etc/thittam/jwt/jwt_public.pem
          envFrom:
            - configMapRef:
                name: thittam-common
          volumeMounts:
            - name: jwt-public-key
              mountPath: /etc/thittam/jwt
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /readyz
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            initialDelaySeconds: 15
            periodSeconds: 30
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: notifications
  namespace: thittam
  labels:
    app: notifications
    app.kubernetes.io/name: notifications
    app.kubernetes.io/part-of: thittam
spec:
  selector:
    app: notifications
  type: ClusterIP
  ports:
    - name: grpc
      port: 8087
      targetPort: grpc
      protocol: TCP
    - name: metrics
      port: 9097
      targetPort: metrics
      protocol: TCP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: notifications
  namespace: thittam
  labels:
    app: notifications
    app.kubernetes.io/part-of: thittam
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: notifications
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
