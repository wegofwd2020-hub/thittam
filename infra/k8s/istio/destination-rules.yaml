---
# ─────────────────────────────────────────────────────────────────────────────
# expense-tracking (port 8082)
# Extends the pre-existing circuit breaker with ROUND_ROBIN.
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: networking.istio.io/v1alpha3
kind: DestinationRule
metadata:
  name: expense-tracking
  namespace: thittam
  labels:
    app.kubernetes.io/part-of: thittam
    app.kubernetes.io/component: traffic-policy
spec:
  host: expense-tracking.thittam.svc.cluster.local
  trafficPolicy:
    loadBalancer:
      simple: ROUND_ROBIN
    connectionPool:
      http:
        h2UpgradePolicy: UPGRADE
    # Circuit breaker thresholds kept from prior configuration.
    outlierDetection:
      consecutive5xxErrors: 5
      interval: 30s
      baseEjectionTime: 30s
      maxEjectionPercent: 50
---
# ─────────────────────────────────────────────────────────────────────────────
# general-ledger (port 8083)
# Financial service — tighter circuit breaker (3 errors, not 5).
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: networking.istio.io/v1alpha3
kind: DestinationRule
metadata:
  name: general-ledger
  namespace: thittam
  labels:
    app.kubernetes.io/part-of: thittam
    app.kubernetes.io/component: traffic-policy
spec:
  host: general-ledger.thittam.svc.cluster.local
  trafficPolicy:
    loadBalancer:
      simple: ROUND_ROBIN
    connectionPool:
      http:
        h2UpgradePolicy: UPGRADE
    # Tighter threshold: ledger errors are high-severity — eject after 3, not 5.
    outlierDetection:
      consecutive5xxErrors: 3
      interval: 15s
      baseEjectionTime: 60s
      maxEjectionPercent: 33
---
