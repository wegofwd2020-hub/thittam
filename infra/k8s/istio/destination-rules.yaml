---
# ─────────────────────────────────────────────────────────────────────────────
# reporting-analytics (port 8085)
# Read-heavy, long-running queries — larger connection pool.
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: networking.istio.io/v1alpha3
kind: DestinationRule
metadata:
  name: reporting-analytics
  namespace: thittam
  labels:
    app.kubernetes.io/part-of: thittam
    app.kubernetes.io/component: traffic-policy
spec:
  host: reporting-analytics.thittam.svc.cluster.local
  trafficPolicy:
    loadBalancer:
      simple: ROUND_ROBIN
    connectionPool:
      http:
        h2UpgradePolicy: UPGRADE
        # Reporting queries can be slow — allow more concurrent streams.
        http2MaxRequests: 200
        maxRequestsPerConnection: 100
    outlierDetection:
      consecutive5xxErrors: 5
      interval: 30s
      baseEjectionTime: 30s
      maxEjectionPercent: 50
---
# ─────────────────────────────────────────────────────────────────────────────
# iam (port 8086)
# Called on every request — tighter circuit breaker, higher availability.
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: networking.istio.io/v1alpha3
kind: DestinationRule
metadata:
  name: iam
  namespace: thittam
  labels:
    app.kubernetes.io/part-of: thittam
    app.kubernetes.io/component: traffic-policy
spec:
  host: iam.thittam.svc.cluster.local
  trafficPolicy:
    loadBalancer:
      simple: ROUND_ROBIN
    connectionPool:
      http:
        h2UpgradePolicy: UPGRADE
        # IAM is on the hot path — allow higher concurrency.
        http2MaxRequests: 500
        maxRequestsPerConnection: 200
    # IAM errors affect every service — eject faster.
    outlierDetection:
      consecutive5xxErrors: 3
      interval: 10s
      baseEjectionTime: 30s
      maxEjectionPercent: 33
---
