# Istio DestinationRules — Thittam
#
# Purpose: force L7 per-request ROUND_ROBIN load balancing for all gRPC services.
#
# Why this is necessary:
#   gRPC multiplexes requests over a single long-lived HTTP/2 connection. A standard
#   Kubernetes L4 load balancer (kube-proxy iptables rules) sees one TCP connection
#   and routes all traffic to the same pod — leaving 2 out of 3 replicas idle under
#   any sustained load. Istio's Envoy sidecar intercepts traffic at L7, allowing
#   ROUND_ROBIN distribution of individual gRPC requests across all healthy pods.
#
# Required settings per service:
#   trafficPolicy.loadBalancer.simple: ROUND_ROBIN
#     — distribute each RPC to the next available pod in round-robin order.
#   trafficPolicy.connectionPool.http.h2UpgradePolicy: UPGRADE
#     — tell Envoy to use HTTP/2 (required for gRPC) even if the service cluster
#       was discovered as HTTP/1.1.
#   trafficPolicy.outlierDetection (all services)
#     — eject pods returning ≥5 consecutive 5xx errors for at least 30 seconds.
#       This prevents a crashing pod from continuing to receive traffic during a
#       rolling update or OOM event.
#
# Verification (after apply):
#   kubectl exec -n thittam deploy/expense-tracking -c istio-proxy -- \
#     pilot-agent request GET clusters | grep project_management | grep -i lb_policy
#   # Expected output: ROUND_ROBIN
#
# Load distribution check (see load-tests/scenarios/lb-distribution.js):
#   k6 run load-tests/scenarios/lb-distribution.js
#   # Then verify via Prometheus:
#   kubectl exec -n monitoring deploy/prometheus -- \
#     promtool query instant \
#       'rate(istio_requests_total{destination_service_namespace="thittam"}[5m])
#        by (destination_workload_instance)'
#   # Each instance should receive ~33% ± 20% of total traffic.
#
# How to apply:
#   kubectl apply -f infra/k8s/istio/destination-rules.yaml
#
# How to verify load balancer policy per service:
#   kubectl get destinationrule -n thittam
---
# ─────────────────────────────────────────────────────────────────────────────
# project-management (port 8080)
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: networking.istio.io/v1alpha3
kind: DestinationRule
metadata:
  name: project-management
  namespace: thittam
  labels:
    app.kubernetes.io/part-of: thittam
    app.kubernetes.io/component: traffic-policy
spec:
  host: project-management.thittam.svc.cluster.local
  trafficPolicy:
    loadBalancer:
      simple: ROUND_ROBIN
    connectionPool:
      http:
        h2UpgradePolicy: UPGRADE
    outlierDetection:
      consecutive5xxErrors: 5
      interval: 30s
      baseEjectionTime: 30s
      maxEjectionPercent: 50
---
