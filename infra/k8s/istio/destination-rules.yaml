# billing (port 8089)
# Financial service — same tight circuit breaker as general-ledger.
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: networking.istio.io/v1alpha3
kind: DestinationRule
metadata:
  name: billing
  namespace: thittam
  labels:
    app.kubernetes.io/part-of: thittam
    app.kubernetes.io/component: traffic-policy
spec:
  host: billing.thittam.svc.cluster.local
  trafficPolicy:
    loadBalancer:
      simple: ROUND_ROBIN
    connectionPool:
      http:
        h2UpgradePolicy: UPGRADE
    # Billing errors affect subscription enforcement — eject after 3, not 5.
    outlierDetection:
      consecutive5xxErrors: 3
      interval: 15s
      baseEjectionTime: 60s
      maxEjectionPercent: 33
