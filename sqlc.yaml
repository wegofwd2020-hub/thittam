version: "2"
sql:
  - engine: "postgresql"
    queries: "pkg/vertical/db/queries.sql"
    schema: "migrations/shared/"
    gen:
      go:
        package: "db"
        out: "pkg/vertical/db"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_empty_slices: true
        overrides:
          - db_type: "uuid"
            go_type: "github.com/google/uuid.UUID"
          - db_type: "jsonb"
            go_type: "encoding/json.RawMessage"
          - db_type: "timestamptz"
            go_type: "time.Time"
