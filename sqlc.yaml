# services/billing is deliberately absent: its data access is hand-written in
# services/billing/db/postgres.go, because the transactional outbox needs
# in-transaction writes that sqlc does not express well. A generated layer was
# configured here and never called (#160) — it drifted several migrations
# behind the schema and dirtied unrelated branches on every `make generate-sqlc`.
# If billing ever wants sqlc, re-add a block here and generate deliberately.
