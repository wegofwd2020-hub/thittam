version: "2"

# Common type overrides applied to every sql block.
# Individual blocks re-declare these under their own overrides key.
# (sqlc v2 does not support top-level global overrides, so they must be repeated.)

sql:
  # ── Shared packages ───────────────────────────────────────────────────────

  - engine: "postgresql"
    queries: "pkg/vertical/db/queries.sql"
    schema: "migrations/shared/"
    gen:
      go:
        package: "db"
        out: "pkg/vertical/db"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_empty_slices: true
        overrides:
          - db_type: "uuid"
            go_type: "github.com/google/uuid.UUID"
          - db_type: "jsonb"
            go_type: "encoding/json.RawMessage"
          - db_type: "timestamptz"
            go_type: "time.Time"

  - engine: "postgresql"
    queries: "pkg/registration/db/queries.sql"
    schema:
      - "migrations/shared/"
      - "migrations/iam/"
    gen:
      go:
        package: "db"
        out: "pkg/registration/db"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_empty_slices: true
        overrides:
          - db_type: "uuid"
            go_type: "github.com/google/uuid.UUID"
          - db_type: "timestamptz"
            go_type: "time.Time"

  # ── Service packages ──────────────────────────────────────────────────────

  - engine: "postgresql"
