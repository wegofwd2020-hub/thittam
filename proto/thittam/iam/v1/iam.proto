// Identity and Access Management Service — Thittam
// This proto file is documentation/contract for future code generation.
// Run `buf generate` to produce Go stubs.

syntax = "proto3";

package thittam.iam.v1;

option go_package = "github.com/wegofwd2020/thittam/gen/iam/v1;iamv1";

import "google/protobuf/timestamp.proto";
import "google/api/annotations.proto";

service IAMService {
  // --- Authentication ---
  // HTTP mappings exposed via grpc-gateway in cmd/iam/main.go on :9086.
  // Kong (in production) and scripts/dev-start.sh (locally) front this
  // with the public REST surface the UI calls.
  rpc Login(LoginRequest) returns (TokenPair) {
    option (google.api.http) = { post: "/api/v1/auth/login" body: "*" };
  }
  rpc RefreshToken(RefreshTokenRequest) returns (TokenPair) {
    option (google.api.http) = { post: "/api/v1/auth/refresh" body: "*" };
  }
  rpc Logout(LogoutRequest) returns (LogoutResponse) {
    option (google.api.http) = { post: "/api/v1/auth/logout" body: "*" };
  }
  // Deprecated: retired. Services verify JWTs in-process against the shared
  // public key (#138). Returns Unimplemented. Not deleted: buf's FILE breaking
  // category makes RPC removal a breaking change (#139 slice I).
  rpc ValidateToken(ValidateTokenRequest) returns (Claims);

  // GetCurrentUser returns the user + tenant identified by the bearer token
  // in the Authorization header. The UI's session-hydration flow calls this
  // after login to populate its in-memory session.
  rpc GetCurrentUser(GetCurrentUserRequest) returns (GetCurrentUserResponse) {
    option (google.api.http) = { get: "/api/v1/auth/me" };
  }

  // --- Users ---
  rpc CreateUser(CreateUserRequest) returns (User);
  rpc GetUser(GetUserRequest) returns (User);
  rpc ListUsers(ListUsersRequest) returns (ListUsersResponse);
  rpc UpdateUser(UpdateUserRequest) returns (User);
  rpc DeactivateUser(DeactivateUserRequest) returns (DeactivateUserResponse);
  rpc ChangePassword(ChangePasswordRequest) returns (ChangePasswordResponse);

  // --- Roles & Permissions ---
  rpc AssignRole(AssignRoleRequest) returns (AssignRoleResponse);
  rpc AssignProjectRole(AssignProjectRoleRequest) returns (AssignProjectRoleResponse);
  rpc RevokeRole(RevokeRoleRequest) returns (RevokeRoleResponse);
  rpc ListRoles(ListRolesRequest) returns (ListRolesResponse);
  rpc CheckPermission(CheckPermissionRequest) returns (CheckPermissionResponse);

  // --- Tenants ---
  rpc CreateTenant(CreateTenantRequest) returns (Tenant);
  rpc GetTenant(GetTenantRequest) returns (Tenant);
  rpc SuspendTenant(SuspendTenantRequest) returns (Tenant);
  // ClearTenantLegalHold resets hold_until and freeze_reason to NULL,
  // releasing the retention-sweeper pause applied by a prior
  // SuspendTenant with legal-hold parameters (#92 Stage 4 pair).
  // Idempotent — calling on a tenant with no active hold is a no-op.
  rpc ClearTenantLegalHold(ClearTenantLegalHoldRequest) returns (Tenant);
  // SetTenantRetention applies a status-preserving legal hold to a suspended
  // tenant — an indefinite pause (hold_until unset) or a dated extension
  // (hold_until in the future). Reuses the freeze_reason/hold_until columns;
  // the retention sweeper skips held tenants. Resume is ClearTenantLegalHold.
  // Platform-admin only (#119).
  rpc SetTenantRetention(SetTenantRetentionRequest) returns (Tenant);
  rpc SetTenantAddress(SetTenantAddressRequest) returns (Tenant);

  // RequestTenantPurge opens a two-person-approval purge request for a
  // purge_eligible tenant (#92 Stage 5). Platform-admin only.
  rpc RequestTenantPurge(RequestTenantPurgeRequest) returns (TenantPurgeRequest);
  // ApproveTenantPurge approves the open pending request for a tenant. The
  // approver must differ from the requester. Platform-admin only.
  rpc ApproveTenantPurge(ApproveTenantPurgeRequest) returns (TenantPurgeRequest);
  // CancelTenantPurge cancels the open (pending or approved) request for a
  // tenant. Platform-admin only.
  rpc CancelTenantPurge(CancelTenantPurgeRequest) returns (TenantPurgeRequest);

  // --- Invitations ---
  rpc InviteUser(InviteUserRequest) returns (Invitation);
  rpc AcceptInvitation(AcceptInvitationRequest) returns (TokenPair) {
    option (google.api.http) = { post: "/api/v1/invitations/{token}/accept" body: "*" };
  }

  // --- OIDC configuration ---
  rpc SetOIDCConfig(SetOIDCConfigRequest) returns (SetOIDCConfigResponse);

  // --- Impersonation (RETIRED, #139 §5) ---
  // Deprecated: both RPCs return Unimplemented. The feature minted no token and
  // set no act/impersonator claim, so it never actually impersonated anyone.
  // Not deleted: buf's FILE breaking category makes RPC removal a breaking change.
  rpc StartImpersonation(StartImpersonationRequest) returns (ImpersonationSession);
  rpc EndImpersonation(EndImpersonationRequest) returns (EndImpersonationResponse);
}

// --- Core domain messages ---

message User {
  string id = 1;
  string tenant_id = 2;
  string email = 3;
  string display_name = 4;
  string status = 5; // active|invited|deactivated
  google.protobuf.Timestamp created_at = 6;
  // Roles + permissions are populated by GetCurrentUser (read from the JWT
  // claims). Other handlers (CreateUser, GetUser, ListUsers) leave them
  // empty — callers that need them must use GetCurrentUser or query the
  // role assignments separately.
  repeated string roles = 7;
  repeated string permissions = 8;
}

message Tenant {
  string id = 1;
  string name = 2;
  string slug = 3;
  string plan = 4;   // starter|professional|enterprise
  string status = 5; // active|suspended|deactivated
  bool is_demo = 6;
  google.protobuf.Timestamp created_at = 7;

  // Company location (#61).
  string address_line1          = 8;
  string address_line2          = 9;
  string city                   = 10;
  string country_code           = 11; // ISO 3166-1 alpha-2
  string postal_code            = 12;
  string primary_currency_code  = 13; // ISO 4217
}

message Role {
  string id = 1;
  string tenant_id = 2;
  string name = 3;
  repeated string permissions = 4;
  bool is_system = 5;
}

message UserRole {
  string user_id = 1;
  string role_id = 2;
  string assigned_by = 3;
  google.protobuf.Timestamp assigned_at = 4;
}

message Invitation {
  string id = 1;
  string tenant_id = 2;
  string email = 3;
  string role_id = 4; // optional pre-assigned role; empty if none
  string status = 5;  // pending|accepted|expired
  string invited_by = 6;
  google.protobuf.Timestamp expires_at = 7;
  google.protobuf.Timestamp created_at = 8;
}

// TokenPair carries the JWT access and refresh tokens returned on successful auth.
message TokenPair {
  string access_token = 1;
  string refresh_token = 2;
  string token_type = 3; // always "Bearer"
  int32 expires_in = 4;  // seconds until access token expires
  google.protobuf.Timestamp expires_at = 5;
}

// Claims is the decoded JWT payload, returned by ValidateToken.
message Claims {
  string subject = 1;      // user UUID
  string tenant_id = 2;
  string email = 3;
  repeated string roles = 4;
  repeated string permissions = 5;
  string auth_method = 6;  // local|oidc
  google.protobuf.Timestamp issued_at = 7;
  google.protobuf.Timestamp expires_at = 8;
}

// --- Request/Response messages ---

// Authentication
message LoginRequest {
  string tenant_id = 1;
  string email = 2;
  string password = 3;
}

message RefreshTokenRequest {
  string refresh_token = 1;
}

message LogoutRequest {
  string refresh_token = 1;
}

message LogoutResponse {}

message ValidateTokenRequest {
  string access_token = 1;
}

message GetCurrentUserRequest {}

message GetCurrentUserResponse {
  User user = 1;
  Tenant tenant = 2;
}

// Users
message CreateUserRequest {
  // Deprecated: ignored. The tenant is derived from the caller's verified token
  // (#144). Sending a value that differs from the token's tenant is rejected
  // with PermissionDenied.
  string tenant_id = 1;
  string email = 2;
  string display_name = 3;
  string password = 4;
}

message GetUserRequest {
  // Deprecated: ignored. The tenant is derived from the caller's verified token
  // (#144). Sending a value that differs from the token's tenant is rejected
  // with PermissionDenied.
  string tenant_id = 1;
  string id = 2;
}

message ListUsersRequest {
  // Deprecated: ignored. The tenant is derived from the caller's verified token
  // (#144). Sending a value that differs from the token's tenant is rejected
  // with PermissionDenied.
  string tenant_id = 1;
  string status = 2; // optional filter: active|invited|deactivated
  int32 limit = 3;
  int32 offset = 4;
}

message ListUsersResponse {
  repeated User users = 1;
}

message UpdateUserRequest {
  // Deprecated: ignored. The tenant is derived from the caller's verified token
  // (#144). Sending a value that differs from the token's tenant is rejected
  // with PermissionDenied.
  string tenant_id = 1;
  string id = 2;
  string display_name = 3;
  string status = 4;
}

message DeactivateUserRequest {
  string tenant_id = 1;
  string id = 2;
}

message DeactivateUserResponse {}

message ChangePasswordRequest {
  // Deprecated: ignored. The subject is derived from the caller's verified token
  // (#139). Sending a value that differs from the authenticated caller is rejected
  // with PermissionDenied.
  string user_id = 1;
  string old_password = 2;
  string new_password = 3;
}

message ChangePasswordResponse {}

// Roles & Permissions
message AssignRoleRequest {
  // Deprecated: ignored. The tenant is derived from the caller's verified token
  // (#144). Sending a value that differs from the token's tenant is rejected
  // with PermissionDenied.
  string tenant_id = 1;
  string user_id = 2;
  string role_id = 3;
  string assigned_by = 4;
}

message AssignRoleResponse {}

// AssignProjectRole grants a project-scoped role (ADR-014 Phase 2). The role
// must be a project-scopable role (project_supervisor or a custom role); the
// IAM service rejects attempts to project-scope tenant-wide system roles.
message AssignProjectRoleRequest {
  // Deprecated: ignored. The tenant is derived from the caller's verified token
  // (#144). Sending a value that differs from the token's tenant is rejected
  // with PermissionDenied.
  string tenant_id   = 1;
  string user_id     = 2;
  string role_id     = 3;
  string project_id  = 4;
  string assigned_by = 5;
}

message AssignProjectRoleResponse {}

message RevokeRoleRequest {
  string user_id = 1;
  string role_id = 2;
}

message RevokeRoleResponse {}

message ListRolesRequest {
  // Deprecated: ignored. The tenant is derived from the caller's verified token
  // (#144). Sending a value that differs from the token's tenant is rejected
  // with PermissionDenied.
  string tenant_id = 1;
}

message ListRolesResponse {
  repeated Role roles = 1;
}

message CheckPermissionRequest {
  string user_id    = 1;
  string permission = 2;
  // Optional. When set, project-scoped role assignments for this project are
  // merged with tenant-wide assignments before evaluating the permission.
  // Empty string means tenant-wide check (ADR-014 Phase 2).
  string project_id = 3;
}

message CheckPermissionResponse {
  bool allowed = 1;
}

// Tenants
message CreateTenantRequest {
  string name = 1;
  string plan = 2; // starter|professional|enterprise
  bool is_demo = 3;

  // Company location (#61). country_code is required for currency derivation;
  // primary_currency_code is optional — when empty the server derives it from
  // the country. Callers in multi-currency countries should set
  // primary_currency_code explicitly.
  string address_line1          = 4;
  string address_line2          = 5;
  string city                   = 6;
  string country_code           = 7; // ISO 3166-1 alpha-2
  string postal_code            = 8;
  string primary_currency_code  = 9; // ISO 4217; optional
}

message SetTenantAddressRequest {
  // Deprecated: ignored. The tenant is derived from the caller's verified token
  // (#144). Sending a value that differs from the token's tenant is rejected
  // with PermissionDenied.
  string tenant_id              = 1;
  string address_line1          = 2;
  string address_line2          = 3;
  string city                   = 4;
  string country_code           = 5;
  string postal_code            = 6;
  string primary_currency_code  = 7; // optional; derived from country_code when empty
}

message GetTenantRequest {
  string id = 1;
}

message SuspendTenantRequest {
  string id = 1;
  // Optional legal-hold parameters (#92 Stage 4). When freeze_reason is set
  // the tenant is considered on hold and the retention sweeper will skip
  // automated lifecycle transitions. hold_until is an auto-release time;
  // if unset the hold is indefinite and must be cleared manually.
  // Absent (proto3 field presence) means "preserve existing hold fields"
  // — subsequent suspend calls without these fields do not clobber an
  // active hold.
  optional google.protobuf.Timestamp hold_until    = 2;
  optional string                    freeze_reason = 3;
}

message ClearTenantLegalHoldRequest {
  string id = 1;
  // Optional rationale captured in the audit event metadata
  // (e.g. "court order 2026-CV-123", "compliance sign-off"). Not
  // validated — free-form operator context for post-hoc forensics.
  optional string reason = 2;
}

message SetTenantRetentionRequest {
  string id = 1;
  // Required, non-empty. Written to freeze_reason; its presence freezes the
  // sweeper. Encodes the operator's rationale (e.g. "retention-extended: ...").
  string freeze_reason = 2;
  // Unset = indefinite pause. Set = extend the hold until this time; the
  // service rejects a value at or before now.
  optional google.protobuf.Timestamp hold_until = 3;
  // Replace an existing active hold. Default false → the call is rejected with
  // FAILED_PRECONDITION if the tenant already has a hold.
  bool overwrite = 4;
}

// PurgeTenant two-person-approval requests (#92 Stage 5).
message RequestTenantPurgeRequest { string tenant_id = 1; string reason = 2; }
message ApproveTenantPurgeRequest { string tenant_id = 1; string reason = 2; }
message CancelTenantPurgeRequest  { string tenant_id = 1; string reason = 2; }

message TenantPurgeRequest {
  string id = 1;
  string tenant_id = 2;
  string status = 3;
  string requested_by = 4;
  google.protobuf.Timestamp requested_at = 5;
  string request_reason = 6;
  string approved_by = 7;
  google.protobuf.Timestamp approved_at = 8;
  google.protobuf.Timestamp executed_at = 9;
  string failure_reason = 10;
}

// Invitations
message InviteUserRequest {
  // Deprecated: ignored. The tenant is derived from the caller's verified token
  // (#144). Sending a value that differs from the token's tenant is rejected
  // with PermissionDenied.
  string tenant_id = 1;
  string email = 2;
  string role_id = 3; // optional; empty means no pre-assigned role
  string invited_by = 4;
}

message AcceptInvitationRequest {
  string token = 1;
  string password = 2;
}

// OIDC configuration
message SetOIDCConfigRequest {
  string tenant_id = 1;
  string issuer_url = 2;
  string client_id = 3;
  string client_secret = 4;          // plaintext; service encrypts before persisting
  repeated string scopes = 5;        // defaults to ["openid","email","profile"]
  string email_claim = 6;            // defaults to "email"
  string display_name_claim = 7;     // defaults to "name"
  string groups_claim = 8;           // optional
  bool auto_provision = 9;
  string default_role = 10;          // defaults to "member"
}

message SetOIDCConfigResponse {}

// Impersonation
message ImpersonationSession {
  string id = 1;
  string platform_user_id = 2;
  string tenant_id = 3;
  string impersonated_user = 4;
  string reason = 5;
  google.protobuf.Timestamp started_at = 6;
  google.protobuf.Timestamp expires_at = 7;
  google.protobuf.Timestamp ended_at = 8; // unset if still active
  string ip_address = 9;
}

message StartImpersonationRequest {
  string platform_user_id = 1;
  string tenant_id = 2;
  string impersonated_user = 3;
  string reason = 4;
  int32 duration_seconds = 5; // 0 = use maximum (4 hours)
  string ip_address = 6;
}

message EndImpersonationRequest {
  string session_id = 1;
}

message EndImpersonationResponse {}
