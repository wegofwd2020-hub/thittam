// Budget Planning Service — Thittam
// This proto file is documentation/contract for future code generation.
// Run `buf generate` to produce Go stubs.

syntax = "proto3";

package thittam.budget.v1;

option go_package = "github.com/wegofwd2020/thittam/gen/budget/v1;budgetv1";

import "google/protobuf/timestamp.proto";
import "google/api/annotations.proto";

service BudgetService {
  rpc CreateBudget(CreateBudgetRequest) returns (Budget);
  rpc GetBudget(GetBudgetRequest) returns (Budget) {
    option (google.api.http) = { get: "/api/v1/budgets/{id}" };
  }
  rpc ListBudgets(ListBudgetsRequest) returns (ListBudgetsResponse) {
    option (google.api.http) = { get: "/api/v1/budgets" };
  }
  rpc SubmitBudget(SubmitBudgetRequest) returns (Budget) {
    option (google.api.http) = { post: "/api/v1/budgets/{id}/submit" body: "*" };
  }
  rpc ApproveBudget(ApproveBudgetRequest) returns (Budget) {
    option (google.api.http) = { post: "/api/v1/budgets/{id}/approve" body: "*" };
  }

  rpc CreateLineItem(CreateLineItemRequest) returns (BudgetLineItem) {
    option (google.api.http) = { post: "/api/v1/budgets/{budget_id}/line-items" body: "*" };
  }
  rpc GetLineItem(GetLineItemRequest) returns (BudgetLineItem);
  rpc ListLineItems(ListLineItemsRequest) returns (ListLineItemsResponse) {
    option (google.api.http) = { get: "/api/v1/budgets/{budget_id}/line-items" };
  }
  rpc UpdateLineItemActuals(UpdateLineItemActualsRequest) returns (BudgetLineItem);
  rpc CheckLineAvailability(CheckLineAvailabilityRequest) returns (CheckLineAvailabilityResponse);

  rpc CreateBudgetFromTemplate(CreateBudgetFromTemplateRequest) returns (Budget);
  rpc GetBudgetCategories(GetBudgetCategoriesRequest) returns (GetBudgetCategoriesResponse);
  rpc GetBudgetTemplates(GetBudgetTemplatesRequest) returns (GetBudgetTemplatesResponse);
}

message Budget {
  string id = 1;
  string tenant_id = 2;
  string production_id = 3;
  string label = 4;
  string status = 5;
  string currency = 6;
  string total_amount = 7;
  string submitted_by = 8;
  string approved_by = 9;
  google.protobuf.Timestamp submitted_at = 10;
  google.protobuf.Timestamp approved_at = 11;
  string created_by = 12;
  google.protobuf.Timestamp created_at = 13;
  google.protobuf.Timestamp updated_at = 14;
}

message BudgetLineItem {
  string id = 1;
  string budget_id = 2;
  string tenant_id = 3;
  string category_id = 4;
  string description = 5;
  string account_code = 6;
  string budgeted_amount = 7;
  string actual_amount = 8;
  string committed_amount = 9;
  bool is_locked = 10;
  google.protobuf.Timestamp created_at = 11;
  google.protobuf.Timestamp updated_at = 12;
}

message BudgetCategoryInfo {
  string id = 1;
  string label = 2;
  string description = 3;
  string default_account_code = 4;
}

message BudgetTemplateInfo {
  string name = 1;
  string description = 2;
  repeated TemplateLineItemInfo line_items = 3;
}

message TemplateLineItemInfo {
  string category_id = 1;
  string description = 2;
  string account_code = 3;
  string default_amount = 4;
  bool is_required = 5;
}

// Request/Response messages
message CreateBudgetRequest { string production_id = 1; string label = 2; string currency = 3; }
message GetBudgetRequest { string id = 1; }
message ListBudgetsRequest { string production_id = 1; string status = 2; int32 limit = 3; string after = 4; }
message ListBudgetsResponse { repeated Budget budgets = 1; }
message SubmitBudgetRequest { string id = 1; }
message ApproveBudgetRequest { string id = 1; }
message CreateLineItemRequest { string budget_id = 1; string category_id = 2; string description = 3; string account_code = 4; string budgeted_amount = 5; }
message GetLineItemRequest { string id = 1; }
message ListLineItemsRequest { string budget_id = 1; }
message ListLineItemsResponse { repeated BudgetLineItem line_items = 1; }
message UpdateLineItemActualsRequest { string id = 1; string actual_amount = 2; string committed_amount = 3; }
message CheckLineAvailabilityRequest { string line_item_id = 1; }
message CheckLineAvailabilityResponse { string available_amount = 1; }
message CreateBudgetFromTemplateRequest { string production_id = 1; string label = 2; string currency = 3; string template_name = 4; }
message GetBudgetCategoriesRequest {}
message GetBudgetCategoriesResponse { repeated BudgetCategoryInfo categories = 1; }
message GetBudgetTemplatesRequest {}
message GetBudgetTemplatesResponse { repeated BudgetTemplateInfo templates = 1; }
