// General Ledger Service — Thittam
// This proto file is documentation/contract for future code generation.
// Run `buf generate` to produce Go stubs.
//
// All monetary amounts are serialised as strings with 2 decimal places
// (e.g. "1500.00") to preserve precision — never float64. Rule #1.

syntax = "proto3";

package thittam.ledger.v1;

option go_package = "github.com/wegofwd2020/thittam/gen/ledger/v1;ledgerv1";

import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";

service LedgerService {
  // --- Chart of Accounts ---
  rpc CreateAccount(CreateAccountRequest) returns (Account) {
    option (google.api.http) = { post: "/api/v1/ledger/accounts" body: "*" };
  }
  rpc GetAccount(GetAccountRequest) returns (Account);
  rpc ListAccounts(ListAccountsRequest) returns (ListAccountsResponse) {
    option (google.api.http) = { get: "/api/v1/ledger/accounts" };
  }

  // Customers and vendors.
  rpc CreateParty(CreatePartyRequest) returns (Party) {
    option (google.api.http) = { post: "/api/v1/ledger/parties" body: "*" };
  }
  rpc GetParty(GetPartyRequest) returns (Party) {
    option (google.api.http) = { get: "/api/v1/ledger/parties/{id}" };
  }
  rpc ListParties(ListPartiesRequest) returns (ListPartiesResponse) {
    option (google.api.http) = { get: "/api/v1/ledger/parties" };
  }
  rpc UpdateParty(UpdatePartyRequest) returns (Party) {
    option (google.api.http) = { put: "/api/v1/ledger/parties/{id}" body: "*" };
  }
  // Posted ledger lines tagged to a party, for viewing.
  rpc ListPartyTransactions(ListPartyTransactionsRequest) returns (ListPartyTransactionsResponse) {
    option (google.api.http) = { get: "/api/v1/ledger/parties/{party_id}/transactions" };
  }

  // SeedChartOfAccounts creates the default accounts for a tenant from a
  // vertical's chart-of-accounts definition. Idempotent: existing codes skipped.
  // Called by the registration pipeline after tenant schema creation.
  rpc SeedChartOfAccounts(SeedChartOfAccountsRequest) returns (SeedChartOfAccountsResponse);

  // --- Accounting Periods ---
  rpc ListAccountingPeriods(ListAccountingPeriodsRequest) returns (ListAccountingPeriodsResponse) {
    option (google.api.http) = { get: "/api/v1/ledger/periods" };
  }
  rpc OpenAccountingPeriod(OpenAccountingPeriodRequest) returns (OpenAccountingPeriodResponse);
  rpc CloseAccountingPeriod(CloseAccountingPeriodRequest) returns (AccountingPeriod);

  // --- Journal Entries ---
  rpc CreateJournalEntry(CreateJournalEntryRequest) returns (JournalEntry) {
    option (google.api.http) = { post: "/api/v1/ledger/journal-entries" body: "*" };
  }
  rpc PostJournalEntry(PostJournalEntryRequest) returns (JournalEntry) {
    option (google.api.http) = { post: "/api/v1/ledger/journal-entries/{id}/post" };
  }
  rpc GetJournalEntry(GetJournalEntryRequest) returns (JournalEntry);
  rpc ListJournalEntries(ListJournalEntriesRequest) returns (ListJournalEntriesResponse) {
    option (google.api.http) = { get: "/api/v1/ledger/journal-entries" };
  }

  // VoidJournalEntry marks a posted entry as void and automatically creates
  // and posts a reversing entry. Returns the reversing entry.
  rpc VoidJournalEntry(VoidJournalEntryRequest) returns (JournalEntry);

  // SetAccountCostBehavior classifies an expense account as fixed or variable.
  // An empty cost_behavior clears the classification.
  rpc SetAccountCostBehavior(SetAccountCostBehaviorRequest) returns (Account) {
    option (google.api.http) = { put: "/api/v1/ledger/accounts/{id}/cost-behavior" body: "*" };
  }

  // --- Reports ---
  // GetMonthlyCostBehavior returns posted expense spend per month, split into
  // fixed, variable, and unclassified. Months are inclusive "YYYY-MM" bounds.
  rpc GetMonthlyCostBehavior(GetMonthlyCostBehaviorRequest) returns (GetMonthlyCostBehaviorResponse) {
    option (google.api.http) = { get: "/api/v1/ledger/reports/monthly-cost-behavior" };
  }
  rpc GetTrialBalance(GetTrialBalanceRequest) returns (GetTrialBalanceResponse) {
    option (google.api.http) = { get: "/api/v1/ledger/trial-balance" };
  }
}

// --- Core domain messages ---

// Account is a node in the chart of accounts hierarchy.
message Account {
  string id = 1;
  string tenant_id = 2;
  string code = 3;
  string name = 4;
  string account_type = 5; // asset|liability|equity|revenue|expense
  string parent_id = 6;    // empty if root account
  bool is_active = 7;
  // Bank accounts only (empty for all other accounts). The full account number
  // is never returned; only its last four digits.
  string bank_name = 8;
  string account_last4 = 9;
  string bank_currency = 10; // ISO 4217
  // fixed|variable for expense accounts; empty when unclassified.
  string cost_behavior = 11;
}

// AccountingPeriod represents a calendar month. Posting to a closed period
// is rejected.
message AccountingPeriod {
  string id = 1;
  string tenant_id = 2;
  int32 year = 3;
  int32 month = 4;
  string status = 5;    // open|closed
  string closed_by = 6; // empty if not yet closed
  google.protobuf.Timestamp closed_at = 7;
}

// JournalEntry is the header for a double-entry transaction.
// Once posted it is immutable; corrections require a reversing entry.
message JournalEntry {
  string id = 1;
  string tenant_id = 2;
  string production_id = 3; // empty if not production-scoped
  string period_id = 4;
  string entry_number = 5;  // e.g. "JE-2024-00001" — allocated on creation
  string reference = 6;     // optional external reference
  string narration = 7;
  string status = 8;        // draft|posted|void
  repeated JournalLine lines = 9;
  string posted_by = 10;    // empty until posted
  google.protobuf.Timestamp posted_at = 11;
  google.protobuf.Timestamp created_at = 12;
}

// JournalLine is one side of a double-entry transaction.
// Exactly one of debit_amount or credit_amount is non-zero.
// Amounts are decimal strings, e.g. "1500.00". Rule #1.
message JournalLine {
  string id = 1;
  string journal_id = 2;
  string account_id = 3;
  string debit_amount = 4;  // "0.00" when this is a credit line
  string credit_amount = 5; // "0.00" when this is a debit line
  string currency = 6;
  string description = 7;
  string party_id = 8; // optional customer or vendor; empty if none
}

// ChartOfAccountEntry is one account in a seed payload, sourced from the
// vertical's chart-of-accounts definition.
message ChartOfAccountEntry {
  string code = 1;
  string name = 2;
  string account_type = 3; // asset|liability|equity|revenue|expense
  string parent_code = 4;  // empty if root account
}

// TrialBalanceEntry is one row in the trial balance report.
message TrialBalanceEntry {
  string account_id = 1;
  string code = 2;
  string name = 3;
  string account_type = 4;
  string debit = 5;   // decimal string, e.g. "5000.00"
  string credit = 6;  // decimal string
  string balance = 7; // debit − credit; negative means credit balance
}

// --- Request/Response messages ---

// Chart of Accounts
message CreateAccountRequest {
  // Ignored. The tenant is derived from the caller's verified token
  // (#144). Sending a value that differs from the token's tenant is rejected
  // with PermissionDenied.
  string tenant_id = 1;
  string code = 2;
  string name = 3;
  string account_type = 4; // asset|liability|equity|revenue|expense
  string parent_id = 5;    // optional
  // Bank account (asset) fields. When any bank field is set, account_type must
  // be asset or empty, code and parent_id must be empty (the service assigns
  // the next free 1xxx code), and account_number is used only to derive
  // account_last4 and is never stored.
  string bank_name = 6;
  string account_number = 7;
  string bank_currency = 8; // ISO 4217, e.g. USD
}

message GetAccountRequest {
  // Ignored. The tenant is derived from the caller's verified token
  // (#144). Sending a value that differs from the token's tenant is rejected
  // with PermissionDenied.
  string tenant_id = 1;
  string id = 2;
}

message ListAccountsRequest {
  // Ignored. The tenant is derived from the caller's verified token
  // (#144). Sending a value that differs from the token's tenant is rejected
  // with PermissionDenied.
  string tenant_id = 1;
}

message ListAccountsResponse {
  repeated Account accounts = 1;
}

// --- Parties (customers and vendors) ---

// A party is a customer, a supplier, or both.
message Party {
  string id = 1;
  string tenant_id = 2;
  string name = 3;
  string party_type = 4;       // customer|supplier|both
  string email = 5;
  string phone = 6;
  string tax_id = 7;
  string address = 8;
  string default_currency = 9; // ISO 4217; empty if none
  bool is_active = 10;
  repeated PartyContact contacts = 11;
}

// A person at a party, to contact about a specific matter.
message PartyContact {
  string id = 1;        // assigned by the service; ignored on input
  string party_id = 2;  // assigned by the service; ignored on input
  string name = 3;
  string designation = 4; // free text, e.g. "Accounts payable"
  string email = 5;
  string phone = 6;
  bool is_primary = 7;  // at most one per party
}

message CreatePartyRequest {
  // Ignored. The tenant is derived from the caller's verified token (#144).
  string tenant_id = 1;
  string name = 2;
  string party_type = 3;       // customer|supplier|both
  string email = 4;
  string phone = 5;
  string tax_id = 6;
  string address = 7;
  string default_currency = 8; // optional ISO 4217
  repeated PartyContact contacts = 9;
}

message GetPartyRequest {
  // Ignored. The tenant is derived from the caller's verified token (#144).
  string tenant_id = 1;
  string id = 2;
}

message ListPartiesRequest {
  // Ignored. The tenant is derived from the caller's verified token (#144).
  string tenant_id = 1;
  // Optional. customer returns customers and both; supplier returns suppliers and both.
  string party_type = 2;
  bool include_inactive = 3;
}

message ListPartiesResponse {
  repeated Party parties = 1;
}

// UpdatePartyRequest replaces every editable field. Send the full record.
message UpdatePartyRequest {
  // Ignored. The tenant is derived from the caller's verified token (#144).
  string tenant_id = 1;
  string id = 2;
  string name = 3;
  string party_type = 4;
  string email = 5;
  string phone = 6;
  string tax_id = 7;
  string address = 8;
  string default_currency = 9;
  bool is_active = 10;
  repeated PartyContact contacts = 11;
}

message SeedChartOfAccountsRequest {
  // Ignored. The tenant is derived from the caller's verified token
  // (#144). Sending a value that differs from the token's tenant is rejected
  // with PermissionDenied.
  string tenant_id = 1;
  repeated ChartOfAccountEntry entries = 2;
}

message SeedChartOfAccountsResponse {
  int32 created = 1; // number of accounts created (skipped = total - created)
  int32 skipped = 2; // accounts that already existed (idempotent)
}

// Accounting Periods
message OpenAccountingPeriodRequest {
  // Ignored. The tenant is derived from the caller's verified token
  // (#144). Sending a value that differs from the token's tenant is rejected
  // with PermissionDenied.
  string tenant_id = 1;
  int32 year = 2;
  int32 month = 3; // 1–12
}

message OpenAccountingPeriodResponse {
  bool already_existed = 1; // true if the period was already open (idempotent)
}

message CloseAccountingPeriodRequest {
  // Ignored. The tenant is derived from the caller's verified token
  // (#144). Sending a value that differs from the token's tenant is rejected
  // with PermissionDenied.
  string tenant_id = 1;
  string period_id = 2;
  // Ignored. The actor is derived from the caller's verified token
  // (#149). Sending a value that differs from the authenticated caller is rejected
  // with PermissionDenied.
  string closed_by = 3;
}

// Journal Entries
message CreateJournalEntryRequest {
  // Ignored. The tenant is derived from the caller's verified token
  // (#144). Sending a value that differs from the token's tenant is rejected
  // with PermissionDenied.
  string tenant_id = 1;
  string production_id = 2; // optional
  string period_id = 3;
  string reference = 4;     // optional
  string narration = 5;
  repeated JournalLineInput lines = 6;
}

// JournalLineInput carries the mutable fields for a new line.
// The id and journal_id are assigned server-side.
message JournalLineInput {
  string account_id = 1;
  string debit_amount = 2;  // decimal string; "0.00" for credit lines
  string credit_amount = 3; // decimal string; "0.00" for debit lines
  string currency = 4;
  string description = 5;
  string party_id = 6; // optional customer or vendor
}

message PostJournalEntryRequest {
  // Ignored. The tenant is derived from the caller's verified token
  // (#144). Sending a value that differs from the token's tenant is rejected
  // with PermissionDenied.
  string tenant_id = 1;
  string id = 2;
  // Ignored. The actor is derived from the caller's verified token
  // (#149). Sending a value that differs from the authenticated caller is rejected
  // with PermissionDenied.
  string posted_by = 3;
}

message GetJournalEntryRequest {
  // Ignored. The tenant is derived from the caller's verified token
  // (#144). Sending a value that differs from the token's tenant is rejected
  // with PermissionDenied.
  string tenant_id = 1;
  string id = 2;
}

message ListJournalEntriesRequest {
  // Ignored. The tenant is derived from the caller's verified token
  // (#144). Sending a value that differs from the token's tenant is rejected
  // with PermissionDenied.
  string tenant_id = 1;
  string period_id = 2; // optional filter
  string status = 3;    // optional filter: draft|posted|void
  int32 limit = 4;
  int32 offset = 5;
}

message ListJournalEntriesResponse {
  repeated JournalEntry entries = 1;
}

message VoidJournalEntryRequest {
  // Ignored. The tenant is derived from the caller's verified token
  // (#144). Sending a value that differs from the token's tenant is rejected
  // with PermissionDenied.
  string tenant_id = 1;
  string id = 2;
  // Ignored. The actor is derived from the caller's verified token
  // (#149). Sending a value that differs from the authenticated caller is rejected
  // with PermissionDenied.
  string voided_by = 3;
}

// Reports
message GetTrialBalanceRequest {
  // Ignored. The tenant is derived from the caller's verified token
  // (#144). Sending a value that differs from the token's tenant is rejected
  // with PermissionDenied.
  string tenant_id = 1;
  google.protobuf.Timestamp as_of = 2;
}

message GetTrialBalanceResponse {
  repeated TrialBalanceEntry entries = 1;
}

message ListAccountingPeriodsRequest {
  // Ignored. The tenant is derived from the caller's verified token
  // (#144). Sending a value that differs from the token's tenant is rejected
  // with PermissionDenied.
  string tenant_id = 1;
}

message ListAccountingPeriodsResponse {
  // Most recent period first.
  repeated AccountingPeriod periods = 1;
}

// --- Party transactions (view only) ---

message PartyLedgerLine {
  string entry_id = 1;
  string entry_number = 2;
  string entry_date = 3;     // RFC 3339
  string narration = 4;
  string account_code = 5;
  string account_name = 6;
  string debit_amount = 7;   // "0.00" when this is a credit line
  string credit_amount = 8;  // "0.00" when this is a debit line
  string currency = 9;
  string description = 10;
}

message ListPartyTransactionsRequest {
  // Ignored. The tenant is derived from the caller's verified token (#144).
  string tenant_id = 1;
  string party_id = 2;
}

message ListPartyTransactionsResponse {
  repeated PartyLedgerLine lines = 1;
  string total_debit = 2;
  string total_credit = 3;
}

message SetAccountCostBehaviorRequest {
  // Ignored. The tenant is derived from the caller's verified token (#144).
  string tenant_id = 1;
  string id = 2;
  string cost_behavior = 3; // fixed|variable, or empty to clear
}

message GetMonthlyCostBehaviorRequest {
  // Ignored. The tenant is derived from the caller's verified token (#144).
  string tenant_id = 1;
  string from_month = 2; // YYYY-MM, inclusive
  string to_month = 3;   // YYYY-MM, inclusive; span at most 36 months
}

message GetMonthlyCostBehaviorResponse {
  repeated MonthlyCostBehavior months = 1;
}

// MonthlyCostBehavior is one month of posted expense spend. Decimal strings,
// e.g. "1250.00". The three buckets sum to total.
message MonthlyCostBehavior {
  string month = 1;        // YYYY-MM
  string fixed = 2;
  string variable = 3;
  string unclassified = 4;
  string total = 5;
}
