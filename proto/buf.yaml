version: v1
name: buf.build/wegofwd2020-hub/thittam
deps:
  - buf.build/protocolbuffers/wellknowntypes
breaking:
  use:
    - FILE
lint:
  use:
    - DEFAULT
  except:
    # Allow short enum value names that don't repeat the enum type name.
    - ENUM_VALUE_PREFIX
    # Allow request/response messages not to be named <RPC>Request/<RPC>Response.
    - RPC_REQUEST_RESPONSE_UNIQUE
    # RPCs return their core domain type directly (e.g. GetSubscription returns
    # Subscription, GetUser returns User) rather than a wrapping <Rpc>Response
    # message. Pragma matches the existing RPC_REQUEST_RESPONSE_UNIQUE exception.
    - RPC_RESPONSE_STANDARD_NAME
    # Same rationale on the request side — e.g. HandlePaymentWebhook accepts
    # WebhookPayload directly, not HandlePaymentWebhookRequest.
    - RPC_REQUEST_STANDARD_NAME
