name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test & Coverage
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.9"
          cache: true

      - name: Run unit tests with coverage
        run: go test ./... -short -race -coverprofile=coverage.out

      - name: Check coverage thresholds
        run: |
          set -euo pipefail

          check_coverage() {
            local pkg="$1"
            local threshold="$2"
            local pct
            pct=$(go tool cover -func=coverage.out \
              | awk -v p="github.com/wegofwd2020/thittam/${pkg}/" \
                '$0 ~ p {sum += $3; count++} END { if (count > 0) printf "%.1f", sum/count; else print "0" }' \
              | tr -d '%')
            # Use bc for float comparison
            if ! echo "${pct} >= ${threshold}" | bc -l | grep -q '^1$'; then
              echo "FAIL: ${pkg} coverage ${pct}% is below threshold ${threshold}%"
              exit 1
            fi
            echo "PASS: ${pkg} ${pct}% >= ${threshold}%"
          }

          # Coverage thresholds per CLAUDE.md
          # iam/general-ledger >=85%, budget/expense >=80%, others >=75%
          # Non-recursive paths: thresholds target the service business logic,
          # not the sqlc-generated db/ subpackages (no test files → 0%, would
          # drag every recursive average below threshold).
          go test ./services/iam           -short -coverprofile=cov_iam.out
          go test ./services/ledger        -short -coverprofile=cov_ledger.out
          go test ./services/budget        -short -coverprofile=cov_budget.out
          go test ./services/expense       -short -coverprofile=cov_expense.out
          go test ./services/document      -short -coverprofile=cov_document.out
          go test ./services/inventory     -short -coverprofile=cov_inventory.out
          go test ./services/reporting     -short -coverprofile=cov_reporting.out
          go test ./services/project       -short -coverprofile=cov_project.out
          go test ./services/notifications -short -coverprofile=cov_notifications.out
          go test ./services/billing       -short -coverprofile=cov_billing.out

          enforce() {
            local covfile="$1"
            local threshold="$2"
            local label="$3"
            local pct
            pct=$(go tool cover -func="${covfile}" | grep "^total:" | awk '{print $3}' | tr -d '%')
            if ! echo "${pct} >= ${threshold}" | bc -l | grep -q '^1$'; then
              echo "FAIL: ${label} coverage ${pct}% is below threshold ${threshold}%"
              exit 1
            fi
            echo "PASS: ${label} ${pct}% >= ${threshold}%"
          }

          enforce cov_iam.out           85 "services/iam"
          enforce cov_ledger.out        85 "services/ledger"
          enforce cov_budget.out        80 "services/budget"
          enforce cov_expense.out       80 "services/expense"
          enforce cov_document.out      75 "services/document"
          enforce cov_inventory.out     75 "services/inventory"
          enforce cov_reporting.out     75 "services/reporting"
          enforce cov_project.out       75 "services/project"
          enforce cov_notifications.out 75 "services/notifications"
          enforce cov_billing.out       75 "services/billing"

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.9"
          cache: true

      - name: golangci-lint
        # action v8 (pairs with golangci-lint v2.x) ships binaries built on
        # Go 1.25+. The v4+'latest' combo previously installed a v1.x binary
        # built on Go 1.24, which can't load a module that targets go 1.25.0.
        uses: golangci/golangci-lint-action@v8
        with:
          version: latest

  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.9"
          cache: true

      - name: Build all services
        run: go build ./cmd/...

  validate-verticals:
    name: Validate Vertical Configs
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.9"
          cache: true

      - name: Validate all production vertical YAMLs
        run: go test -run TestValidateAllProductionVerticals ./pkg/vertical/...

  critical-e2e:
    name: Critical-Path E2E
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.9"
          cache: true

      - name: Run critical-path E2E tests
        # No Docker, no DB — all service deps are in-process mocks.
        # Target: ≤5 minutes. These 5 tests run in <1 second.
        run: go test ./e2e/critical_path/... -v -short -race -timeout 5m

  migration-validate:
    name: Migration Validate (up + down)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: thittam
          POSTGRES_PASSWORD: thittam_ci
          POSTGRES_DB: thittam
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DB_URL: postgres://thittam:thittam_ci@localhost:5432/thittam?sslmode=disable

    steps:
      - uses: actions/checkout@v4

      - name: Install golang-migrate CLI
        run: |
          curl -sSL https://github.com/golang-migrate/migrate/releases/download/v4.17.1/migrate.linux-amd64.tar.gz \
            | tar -xz -C /usr/local/bin migrate

      - name: Run all migrations UP
        run: |
          set -euo pipefail
          for dir in shared iam budget expense ledger inventory reporting project notifications document billing audit; do
            echo "==> migrate up: ${dir}"
            migrate -path "migrations/${dir}" \
              -database "${DB_URL}&x-migrations-table=schema_migrations_${dir}" up
          done

      - name: Run all migrations DOWN (full rollback)
        # Rolling back verifies that every migration has a valid .down.sql and
        # that the down migration does not error. Rollback is run in reverse
        # service order so foreign-key constraints are respected.
        run: |
          set -euo pipefail
          for dir in audit billing document notifications project reporting inventory ledger expense budget iam shared; do
            echo "==> migrate down: ${dir}"
            migrate -path "migrations/${dir}" \
              -database "${DB_URL}&x-migrations-table=schema_migrations_${dir}" down -all
          done

  integration-tests:
    name: Integration Tests (real Postgres)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: thittam
          POSTGRES_PASSWORD: thittam_ci
          POSTGRES_DB: thittam
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      # Tests run against a dedicated thittam_test DB so they cannot collide
      # with a parallel migration-validate job using thittam.
      TEST_DB_URL: postgres://thittam:thittam_ci@localhost:5432/thittam_test?sslmode=disable
      THITTAM_TEST_DSN: postgres://thittam:thittam_ci@localhost:5432/thittam_test?sslmode=disable

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.9"
          cache: true

      - name: Install golang-migrate CLI
        run: |
          curl -sSL https://github.com/golang-migrate/migrate/releases/download/v4.17.1/migrate.linux-amd64.tar.gz \
            | tar -xz -C /usr/local/bin migrate

      - name: Create thittam_test database
        env:
          PGPASSWORD: thittam_ci
        run: |
          psql -h localhost -U thittam -d postgres \
            -c "CREATE DATABASE thittam_test OWNER thittam;"

      - name: Run all migrations against thittam_test
        # Mirrors `make migrate-all` ordering: shared first (vertical_definitions
        # is referenced by tenant rows), then iam (tenants/users referenced by
        # the rest), then service migrations.
        run: |
          set -euo pipefail
          for dir in shared iam budget expense ledger inventory reporting project notifications document billing audit; do
            echo "==> migrate up: ${dir}"
            migrate -path "migrations/${dir}" \
              -database "${TEST_DB_URL}&x-migrations-table=schema_migrations_${dir}" up
          done

      - name: Run integration tests (-tags=integration)
        # Includes the trigger from #39 (services/iam/db/user_roles_scope_*)
        # and the rewritten pkg/vertical/db integration test.
        run: go test ./... -tags=integration -race -timeout 5m

  secret-scan:
    name: Secret Detection
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history needed so gitleaks can scan every commit in the PR.
          fetch-depth: 0

      - name: gitleaks — scan for committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  vuln-scan:
    name: Vulnerability Scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.9"
          cache: true

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.1.4

      - name: govulncheck — scan for known CVEs in dependencies
        # Fail the job if any vulnerability is found in reachable code.
        # Use -show verbose to surface the call chain for triage.
        run: govulncheck -show verbose ./...

  proto-breaking:
    name: Protobuf Breaking Change Detection
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install buf
        uses: bufbuild/buf-setup-action@v1
        with:
          version: "1.34.0"

      - name: buf lint — validate proto files
        run: buf lint proto

      - name: buf breaking — detect breaking changes against main
        # Compare the current branch against the last known-good state on main.
        # Fails if any field is removed, renamed, or type-changed in a way that
        # would break existing clients.
        run: buf breaking proto --against '.git#branch=main,subdir=proto'

  doc-drift:
    name: Documentation Drift Check
    runs-on: ubuntu-latest
    # Run when Go source files change (someone may rename/remove an identifier)
    # or when triggered manually. The docs repo runs the same check on its own
    # PRs via thittam_docs/.github/workflows/ci.yml.

    steps:
      - name: Skip if DOCS_REPO_TOKEN not configured
        # thittam_docs is a private repo; the default GITHUB_TOKEN cannot read
        # it. Without a PAT, gracefully skip rather than 404 on checkout.
        # To enable: add a PAT with `Contents: read` on wegofwd2020-hub/thittam_docs
        # as repo secret DOCS_REPO_TOKEN.
        if: ${{ secrets.DOCS_REPO_TOKEN == '' }}
        run: |
          echo "::warning::DOCS_REPO_TOKEN not set — drift check skipped."
          echo "Add a PAT to repo secrets to enable. See ticket #57."
          exit 0

      - name: Checkout application repo
        if: ${{ secrets.DOCS_REPO_TOKEN != '' }}
        uses: actions/checkout@v4
        with:
          path: app

      - name: Checkout docs repo
        if: ${{ secrets.DOCS_REPO_TOKEN != '' }}
        uses: actions/checkout@v4
        with:
          repository: wegofwd2020-hub/thittam_docs
          token: ${{ secrets.DOCS_REPO_TOKEN }}
          path: docs

      - uses: actions/setup-go@v5
        if: ${{ secrets.DOCS_REPO_TOKEN != '' }}
        with:
          go-version: "1.25.9"
          cache: true
          cache-dependency-path: app/go.sum

      - name: Check documentation drift (Rule #16)
        if: ${{ secrets.DOCS_REPO_TOKEN != '' }}
        working-directory: app
        run: |
          go run ./tools/check-doc-drift \
            --docs ../docs \
            --app  .
