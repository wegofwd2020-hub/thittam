name: Nightly

on:
  schedule:
    - cron: "0 2 * * *" # 02:00 UTC daily
  workflow_dispatch:     # allow manual trigger

jobs:
  full-integration:
    name: Full Integration Suite
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true

      - name: Run unit tests (all packages, with race detector)
        run: go test ./... -short -race -coverprofile=coverage.out

      - name: Run integration tests (vertical cross-service suite)
        run: go test ./tests/integration/... -race -timeout 10m

      - name: Run critical-path E2E tests
        run: go test ./e2e/critical_path/... -v -race -timeout 5m

      - name: Coverage report
        run: |
          go tool cover -func=coverage.out | grep "^total:"
          go tool cover -html=coverage.out -o coverage.html

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.html
          retention-days: 7

  build-all:
    name: Build All Services
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true

      - name: Build all service binaries
        run: go build ./cmd/...

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v4
        with:
          version: latest

  validate-verticals:
    name: Validate Vertical Configs
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true

      - name: Validate all production vertical YAMLs
        run: go test -run TestValidateAllProductionVerticals ./pkg/vertical/...

  vuln-scan:
    name: Vulnerability Scan (Nightly)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.1.4

      - name: govulncheck — full dependency graph scan
        # Nightly scan covers the entire dependency tree, not just reachable code,
        # to surface vulnerabilities in indirect dependencies before they become reachable.
        run: govulncheck -show verbose ./...
