name: Nightly API Docs Regeneration

# Regenerates the proto reference from all services' .proto files via
# buf.gen.docs.yaml (using buf.build/community/pseudomuto-doc) and pushes
# the output to thittam_docs/docs/developers/api/generated/PROTO_REFERENCE.md.

on:
  schedule:
    - cron: "30 4 * * *" # 04:30 UTC — after StudyBuddy api-docs (04:00)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regenerate:
    runs-on: ubuntu-latest
    env:
      DOCS_WRITE_TOKEN_PRESENT: ${{ secrets.DOCS_REPO_WRITE_TOKEN != '' }}
    steps:
      - name: Skip if DOCS_REPO_WRITE_TOKEN not configured
        if: env.DOCS_WRITE_TOKEN_PRESENT == 'false'
        run: |
          echo "::warning::DOCS_REPO_WRITE_TOKEN not set — api-docs regeneration skipped."
          echo "Add a fine-grained PAT with Contents:Read-and-write on wegofwd2020-hub/thittam_docs as repo secret DOCS_REPO_WRITE_TOKEN."
          exit 0

      - name: Checkout application repo
        if: env.DOCS_WRITE_TOKEN_PRESENT == 'true'
        uses: actions/checkout@v4
        with:
          path: app

      - name: Checkout docs repo
        if: env.DOCS_WRITE_TOKEN_PRESENT == 'true'
        uses: actions/checkout@v4
        with:
          repository: wegofwd2020-hub/thittam_docs
          token: ${{ secrets.DOCS_REPO_WRITE_TOKEN }}
          path: docs

      - name: Install buf
        if: env.DOCS_WRITE_TOKEN_PRESENT == 'true'
        uses: bufbuild/buf-setup-action@v1
        with:
          version: "1.34.0"

      - name: Generate proto reference
        if: env.DOCS_WRITE_TOKEN_PRESENT == 'true'
        working-directory: app
        run: |
          buf generate --template buf.gen.docs.yaml proto

      - name: Copy into docs repo
        if: env.DOCS_WRITE_TOKEN_PRESENT == 'true'
        run: |
          mkdir -p docs/docs/developers/api/generated
          cp app/generated-docs/PROTO_REFERENCE.md docs/docs/developers/api/generated/PROTO_REFERENCE.md

      - name: Commit and push to docs repo if changed
        if: env.DOCS_WRITE_TOKEN_PRESENT == 'true'
        working-directory: docs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/developers/api/generated/PROTO_REFERENCE.md
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore(api-docs): nightly regeneration from thittam proto

Auto-generated by .github/workflows/nightly-api-docs.yml in thittam.
Source: buf generate against proto/thittam/**/*.proto."
          git push
